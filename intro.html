<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Anglais Éclair · La visite guidée</title>
  <meta name="description" content="La démo d’Anglais Éclair : le site se pilote tout seul devant toi. Recherche, mots en images, 12 temps, fiches corrigées, mode tableau, mode enseignant, réglages, jeux.">
  <meta name="theme-color" content="#0b0d24">
  <meta property="og:title" content="Anglais Éclair ⚡ La visite guidée">
  <meta property="og:description" content="Regarde le site se piloter tout seul : recherche, mots en images, fiches corrigées, mode tableau, jeux…">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <style>
    :root { --night: #0b0d24; --night-2: #161b4a; --accent: #3d5afe; --spark: #ffc930; --pink: #ff4f8b; --ink: #f3f4ff; --muted: #a9aed6;
      --display: "Unbounded", "Arial Black", system-ui, sans-serif; --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; }

    /* Décor */
    .sky { position: fixed; inset: 0; background:
      radial-gradient(55% 50% at 15% 10%, rgba(61,90,254,.55), transparent 70%),
      radial-gradient(45% 45% at 90% 95%, rgba(255,79,139,.35), transparent 70%),
      linear-gradient(160deg, var(--night-2), var(--night)); }
    .sky::after { content: ""; position: absolute; inset: -50%; background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.5px); background-size: 32px 32px; animation: drift 50s linear infinite; }
    @keyframes drift { to { transform: translate(32px, 64px); } }

    /* Scène + caméra */
    .stage { position: fixed; inset: 0 0 60px; overflow: hidden; }
    .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .win { position: relative; border-radius: 14px; background: #fff; box-shadow: 0 50px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12); overflow: hidden; }
    .win.phone { border-radius: 46px; background: #0d0e16; box-shadow: 0 50px 120px rgba(0,0,0,.6), 0 0 0 2px #2b2d3d, inset 0 0 0 2px #2b2d3d; }
    .bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #eceef5; border-bottom: 1px solid #d9dcea; }
    .dots { display: flex; gap: 7px; }
    .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
    .dots i:nth-child(2) { background: #febc2e; } .dots i:nth-child(3) { background: #28c840; }
    .url { flex: 1; max-width: 640px; margin: 0 auto; height: 26px; border-radius: 8px; background: #fff; color: #3a3f5c; font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 0 12px; white-space: nowrap; overflow: hidden; border: 1px solid #dfe2ee; }
    .url .lock { color: #1aa260; }
    .url .caret { width: 1.5px; height: 15px; background: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .phone .bar { left: 12px; right: 12px; top: 12px; height: 36px; border-radius: 34px 34px 0 0; padding: 0 16px; background: #f1f2f8; }
    .phone .dots { display: none; }
    .phone .url { font-size: 12px; height: 24px; border-radius: 12px; }
    .site { position: absolute; border: 0; background: #fff; pointer-events: none; }
    .phone .site { border-radius: 0 0 34px 34px; }
    .loadbar { position: absolute; height: 3px; background: var(--accent); width: 0; z-index: 3; }
    .curtain { position: absolute; background: #fff; z-index: 2; transition: opacity .5s; display: grid; place-items: center; color: #8d92b5; font-weight: 700; }
    .curtain.off { opacity: 0; pointer-events: none; }

    /* Curseur */
    .cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; z-index: 20; pointer-events: none; transform-origin: 3px 3px; transition: transform .12s; filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); }
    .cursor.down { transform: scale(.82); }
    .cursor svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .ripple { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 3px solid var(--spark); background: rgba(255,201,48,.25); z-index: 19; pointer-events: none; animation: ripple .55s ease-out forwards; }
    @keyframes ripple { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

    /* Légendes, touches */
    .caption { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 30; width: max-content; max-width: min(92vw, 820px); padding: 14px 24px; border-radius: 18px; background: rgba(9,11,32,.86); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 18px 50px rgba(0,0,0,.45); font-weight: 700; font-size: clamp(1rem, 2.4vmin, 1.35rem); text-align: center; line-height: 1.35; transition: opacity .35s, transform .35s; }
    .caption.hide { opacity: 0; transform: translateX(-50%) translateY(16px); }
    .caption.top { bottom: auto; top: 64px; }
    .caption small { display: block; font-weight: 500; color: var(--muted); font-size: .8em; margin-top: 2px; }
    .keycap { position: fixed; left: 50%; bottom: 168px; z-index: 31; transform: translateX(-50%) scale(.6); opacity: 0; padding: 10px 18px; min-width: 64px; text-align: center; border-radius: 12px; background: #f6f7ff; color: #12142b; font-weight: 800; font-size: 1.1rem; box-shadow: 0 5px 0 #b9bdd6, 0 14px 30px rgba(0,0,0,.4); transition: transform .15s cubic-bezier(.3,1.6,.5,1), opacity .15s; }
    .keycap.on { transform: translateX(-50%) scale(1); opacity: 1; }
    .chapter { position: fixed; right: 16px; top: 14px; z-index: 30; padding: 8px 14px; border-radius: 999px; background: rgba(9,11,32,.7); border: 1px solid rgba(255,255,255,.14); font-weight: 800; font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; color: var(--spark); transition: opacity .3s; }

    /* Cartes titre (début / fin) */
    .card { position: fixed; inset: 0 0 60px; z-index: 25; display: grid; place-items: center; align-content: center; gap: 18px; padding: 24px 16px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .6s; }
    .card.on { opacity: 1; pointer-events: auto; }
    .card h1 { font-family: var(--display); font-size: clamp(2.2rem, 9vmin, 6rem); margin: 0; line-height: 1.05; letter-spacing: -.02em; min-height: 1.1em; }
    .card h1 .hl { color: var(--spark); }
    .card p { margin: 0; color: var(--muted); font-size: clamp(1rem, 2.8vmin, 1.5rem); }
    .eyebrow { font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--spark); font-size: clamp(.75rem, 2vmin, 1rem); }
    .mascot { width: clamp(90px, 20vmin, 170px); filter: drop-shadow(0 16px 36px rgba(255,201,48,.45)); }
    .mascot svg { display: block; width: 100%; height: auto; animation: hop 1.1s ease-in-out infinite; transform-origin: 50% 100%; }
    @keyframes hop { 0%, 100% { transform: none; } 15% { transform: scale(1.08, .9); } 45% { transform: translateY(-12%) scale(.95, 1.06) rotate(-4deg); } 75% { transform: scale(1.04, .96); } }
    .eyes { animation: eyeblink 3.2s 1s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes eyeblink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .badges span { padding: 8px 16px; border-radius: 999px; font-weight: 800; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); }
    .end-row { display: flex; gap: clamp(16px, 4vmin, 40px); align-items: center; justify-content: center; flex-wrap: wrap; }
    .qr { width: clamp(110px, 20vmin, 170px); background: #fff; padding: 9px; border-radius: 14px; }
    .qr svg { display: block; width: 100%; height: auto; }
    .link { font-family: var(--display); color: var(--spark); font-size: clamp(.75rem, 2.2vmin, 1.05rem); word-break: break-all; }
    .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 800; font-size: 1.05rem; text-decoration: none; color: var(--night); background: var(--spark); box-shadow: 0 6px 0 #c99400; }
    .btn.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; border: 2px solid rgba(255,255,255,.3); }

    /* Écran de départ */
    .poster { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; padding: 24px 16px; background: radial-gradient(60% 60% at 50% 45%, rgba(61,90,254,.35), transparent 70%), rgba(9,11,32,.8); backdrop-filter: blur(6px); transition: opacity .5s; }
    .poster.hide { opacity: 0; pointer-events: none; }
    .poster h1 { font-family: var(--display); font-size: clamp(1.8rem, 7vmin, 4rem); margin: 0; }
    .poster p { margin: 0; color: var(--muted); max-width: 36ch; }
    .play { width: clamp(84px, 17vmin, 116px); aspect-ratio: 1; border-radius: 50%; border: 0; background: var(--spark); color: var(--night); font-size: clamp(2rem, 6vmin, 2.8rem); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,201,48,.6); } 70% { box-shadow: 0 0 0 26px rgba(255,201,48,0); } 100% { box-shadow: 0 0 0 0 rgba(255,201,48,0); } }
    .linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 1rem; }

    /* Commandes */
    .controls { position: fixed; left: 0; right: 0; bottom: 0; height: 60px; z-index: 35; display: flex; align-items: center; gap: 6px; padding: 0 14px env(safe-area-inset-bottom); background: rgba(8,10,28,.85); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,.1); }
    .controls button, .controls a { flex: none; height: 40px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 12px; background: rgba(255,255,255,.1); color: #fff; font-size: 1.05rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; white-space: nowrap; }
    .controls button:hover, .controls a:hover { background: rgba(255,255,255,.2); }
    .controls .go { background: var(--spark); color: var(--night); font-size: .95rem; }
    .controls button.off { opacity: .45; }
    .progress { flex: 1; min-width: 40px; display: flex; gap: 4px; }
    .controls .seg { flex: 1 1 0; min-width: 0; height: 8px; padding: 0; border-radius: 6px; background: rgba(255,255,255,.18); position: relative; overflow: hidden; }
    .controls .seg.done { background: var(--spark); }
    .controls .seg.cur { background: rgba(255,201,48,.55); animation: glow 1.2s ease-in-out infinite alternate; }
    @keyframes glow { to { background: rgba(255,201,48,.95); } }
    @media (max-width: 560px) {
      .controls { gap: 4px; padding: 0 8px env(safe-area-inset-bottom); }
      .controls .opt { display: none; }
      .controls .go span { display: none; }
      .progress { gap: 2px; }
      .caption { bottom: 72px; padding: 10px 16px; }
      .keycap { bottom: 150px; }
      .chapter { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="chapter" id="chapter" aria-hidden="true">Visite guidée</div>

  <div class="stage" id="stage">
    <div class="cam" id="cam">
      <div class="win" id="win">
        <div class="bar"><span class="dots"><i></i><i></i><i></i></span><div class="url"><span class="lock">🔒</span><span id="urlText"></span><span class="caret" id="caret"></span></div></div>
        <iframe class="site" id="site" title="Le site Anglais Éclair, piloté par la démo" tabindex="-1" aria-hidden="true"></iframe>
        <div class="loadbar" id="loadbar"></div>
        <div class="curtain" id="curtain">⚡</div>
        <div class="cursor" id="cursor"><svg viewBox="0 0 24 24"><path d="M4 2.5 19.5 13l-7 1.3 4.2 7.6-3 1.6-4.2-7.7L4.6 21Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
  </div>

  <div class="caption hide" id="caption" role="status" aria-live="polite"></div>
  <div class="keycap" id="keycap" aria-hidden="true"></div>

  <section class="card" id="cardStart" aria-hidden="true">
    <div class="mascot" data-mascot></div>
    <span class="eyebrow">La visite guidée</span>
    <h1 id="typedTitle"></h1>
    <p id="typedSub">&nbsp;</p>
  </section>

  <section class="card" id="cardEnd">
    <div class="end-row">
      <div class="mascot" data-mascot></div>
      <div style="display:grid;gap:12px;justify-items:center">
        <h1 style="font-size:clamp(1.8rem,7vmin,4.4rem)">À toi de <span class="hl">jouer</span> !</h1>
        <div class="badges"><span>Gratuit</span><span>Sans compte</span><span>Sans pub</span><span>Hors connexion</span></div>
      </div>
      <div style="display:grid;gap:8px;justify-items:center"><div class="qr" id="qr" aria-label="QR code du site"></div><span class="link">hnwrc2dwh7-debug.github.io/anglais-eclair</span></div>
    </div>
    <div class="btns"><a class="btn" href="./">Ouvrir le site ⚡</a><button class="btn ghost" type="button" id="replay">↺ Revoir la démo</button></div>
  </section>

  <div class="poster" id="poster">
    <div class="mascot" data-mascot></div>
    <span class="eyebrow">Démo · 2 minutes</span>
    <h1>Anglais Éclair</h1>
    <p>Regarde le site se piloter tout seul : recherche, mots en images, fiches corrigées, mode tableau…</p>
    <button class="play" id="start" type="button" aria-label="Lancer la démo avec le son">▶</button>
    <button class="linkish" id="startMute" type="button">Lancer sans le son</button>
  </div>

  <nav class="controls" aria-label="Commandes de la démo">
    <button type="button" id="restart" class="opt" title="Recommencer (R)" aria-label="Recommencer">⏮</button>
    <button type="button" id="prev" title="Étape précédente (←)" aria-label="Étape précédente">◀</button>
    <button type="button" id="play" title="Pause / lecture (Espace)" aria-label="Pause">⏸</button>
    <button type="button" id="next" title="Étape suivante (→)" aria-label="Étape suivante">▶</button>
    <div class="progress" id="progress"></div>
    <button type="button" id="music" class="opt" title="Musique" aria-label="Couper la musique">🎵</button>
    <button type="button" id="mute" title="Son (M)" aria-label="Couper le son">🔊</button>
    <button type="button" id="full" class="opt" title="Plein écran (F)" aria-label="Plein écran">⛶</button>
    <a class="go" href="./">⚡<span>&nbsp;Le site</span></a>
  </nav>

  <script src="assets/js/vendor/qrcode.js"></script>
  <script>
  (() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const SITE = "https://hnwrc2dwh7-debug.github.io/anglais-eclair/";
  const SHOWN_URL = "hnwrc2dwh7-debug.github.io/anglais-eclair";
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---------- Mascotte et QR ---------- */
  const MASCOT = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9 22l10-12h-6.6L13.5 2Z" fill="#ffc930" stroke="#1c1600" stroke-width=".9" stroke-linejoin="round"/>
    <g class="eyes"><circle cx="9.6" cy="11.2" r="1.15" fill="#fff" stroke="#1c1600" stroke-width=".35"/><circle cx="13.6" cy="11.2" r="1.15" fill="#fff" stroke="#1c1600" stroke-width=".35"/><circle cx="9.8" cy="11.3" r=".55" fill="#1c1600"/><circle cx="13.8" cy="11.3" r=".55" fill="#1c1600"/></g>
    <path d="M10.4 12.9q1.3 1.1 2.6 0" fill="none" stroke="#1c1600" stroke-width=".45" stroke-linecap="round"/></svg>`;
  document.querySelectorAll("[data-mascot]").forEach(m => m.innerHTML = MASCOT);
  try { const qr = window.qrcode(0, "M"); qr.addData(SITE); qr.make(); $("#qr").innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); } catch { $("#qr").remove(); }

  /* ---------- Horloge (s'arrête pendant la pause) ---------- */
  let clock = 0, playing = false, last = 0, runId = 0;
  const waits = [], tweens = [];
  class Stop extends Error {}
  const sleep = ms => new Promise((res, rej) => waits.push({ at: clock + ms, res, rej, id: runId }));
  const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  const tween = (ms, fn, ez = ease) => new Promise((res, rej) => { tweens.push({ t0: clock, ms, fn, ez, res, rej, id: runId }); });
  const frame = now => {
    const dt = last ? Math.min(80, now - last) : 0; last = now;
    if (playing) {
      clock += dt;
      for (let i = tweens.length - 1; i >= 0; i--) {
        const tw = tweens[i];
        if (tw.id !== runId) { tweens.splice(i, 1); tw.rej(new Stop()); continue; }
        const p = Math.min(1, (clock - tw.t0) / tw.ms);
        tw.fn(tw.ez(p));
        if (p >= 1) { tweens.splice(i, 1); tw.res(); }
      }
      for (let i = waits.length - 1; i >= 0; i--) {
        const w = waits[i];
        if (w.id !== runId) { waits.splice(i, 1); w.rej(new Stop()); }
        else if (clock >= w.at) { waits.splice(i, 1); w.res(); }
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  const cancelAll = () => { runId++; [...tweens, ...waits].forEach(x => x.rej(new Stop())); tweens.length = waits.length = 0; };

  /* ---------- Sons (créés par le navigateur, aucun fichier) ---------- */
  let ac = null, sfxBus = null, musicBus = null, muted = false, musicOn = true, beatTimer = null, step = 0, nextBeat = 0, noiseBuf = null;
  const initAudio = () => {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    const out = ac.createDynamicsCompressor(); out.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(out);
    musicBus = ac.createGain(); musicBus.gain.value = .22; musicBus.connect(out);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
  };
  const applyVolumes = () => { if (!ac) return; sfxBus.gain.value = muted ? 0 : 1; musicBus.gain.value = muted || !musicOn ? 0 : .22; };
  const env = (g, t, a, peak, dec) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); };
  const noise = (bus, t, type, f, q, peak, dec) => { const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.frequency.value = f; fl.Q.value = q; env(g, t, .001, peak, dec); s.connect(fl).connect(g).connect(bus); s.start(t, Math.random() * .5); s.stop(t + dec + .05); };
  const tone = (bus, t, f, type, peak, dec, cut = 4000) => { const o = ac.createOscillator(), fl = ac.createBiquadFilter(), g = ac.createGain(); o.type = type; o.frequency.value = f; fl.type = "lowpass"; fl.frequency.value = cut; env(g, t, .004, peak, dec); o.connect(fl).connect(g).connect(bus); o.start(t); o.stop(t + dec + .05); };
  const sfx = {
    click() { if (!ac) return; const t = ac.currentTime; noise(sfxBus, t, "bandpass", 3200, 1.2, .55, .025); tone(sfxBus, t, 1500, "sine", .12, .03); noise(sfxBus, t + .045, "bandpass", 2400, 1.2, .3, .02); },
    key() { if (!ac) return; const t = ac.currentTime; noise(sfxBus, t, "bandpass", rand(2600, 4200), 1.5, rand(.28, .42), .022); tone(sfxBus, t, rand(150, 210), "sine", .07, .03); },
    space() { if (!ac) return; const t = ac.currentTime; noise(sfxBus, t, "bandpass", 1500, 1, .45, .04); tone(sfxBus, t, 120, "sine", .12, .05); },
    whoosh() { if (!ac) return; const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; fl.type = "bandpass"; fl.Q.value = 1.5; fl.frequency.setValueAtTime(300, t); fl.frequency.exponentialRampToValueAtTime(3500, t + .4); env(g, t, .15, .16, .3); s.connect(fl).connect(g).connect(sfxBus); s.start(t); s.stop(t + .55); },
    pop() { if (!ac) return; const t = ac.currentTime; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(900, t + .08); env(g, t, .005, .2, .12); o.connect(g).connect(sfxBus); o.start(t); o.stop(t + .2); },
    win() { if (!ac) return; const t = ac.currentTime; [72, 76, 79, 84].forEach((n, i) => tone(sfxBus, t + i * .09, 440 * Math.pow(2, (n - 69) / 12), "triangle", .16, .35)); },
    wrong() { if (!ac) return; const t = ac.currentTime; tone(sfxBus, t, 220, "square", .06, .18, 900); tone(sfxBus, t + .1, 185, "square", .06, .25, 900); }
  };
  /* Petite boucle lo-fi en fond */
  const CHORDS = [[48, 55, 64, 67], [45, 52, 60, 64], [41, 48, 57, 60], [43, 50, 59, 62]];
  const hz = n => 440 * Math.pow(2, (n - 69) / 12), SIX = 60 / 92 / 4;
  const beat = (s, t) => {
    const i = s % 16, ch = CHORDS[Math.floor(s / 16) % 4];

      for (let i = from; i < CHAPTERS.length; i++) {
        markChap(i);
        if (i > from && CHAPTERS[i].start.startsWith("fiche") && !W().location.hash.includes(CHAPTERS[i].start)) await silentGo(CHAPTERS[i].start);
        try { await CHAPTERS[i].run(); } catch (e) { if (e instanceof Stop) throw e; console.warn("Étape sautée :", CHAPTERS[i].name, e); hover(null); }
        await sleep(350);
      }
      segs.forEach(s => { s.classList.add("done"); s.classList.remove("cur"); });
      setPlaying(false, true);
    } catch (e) { if (!(e instanceof Stop)) { console.error(e); } }
  };

  const setPlaying = (p, ended) => {
    playing = p;
    $("#play").textContent = p ? "⏸" : "▶"; $("#play").setAttribute("aria-label", p ? "Pause" : "Lecture");
    if (ac) { if (p) { ac.resume(); } else if (!ended) ac.suspend(); }
  };
  const setMuted = m => { muted = m; applyVolumes(); $("#mute").textContent = m ? "🔇" : "🔊"; $("#mute").setAttribute("aria-label", m ? "Remettre le son" : "Couper le son"); if (!m && musicOn && started) startMusic(); };
  const begin = withSound => { $("#poster").classList.add("hide"); initAudio(); if (ac) ac.resume(); setMuted(!withSound); run(0); };
  $("#start").addEventListener("click", () => begin(true));
  $("#startMute").addEventListener("click", () => begin(false));
  $("#play").addEventListener("click", () => {
    if (!started) return begin(true);
    if (!playing && segs.every(s => s.classList.contains("done"))) return run(0);
    setPlaying(!playing);
  });
  $("#prev").addEventListener("click", () => started ? run(Math.max(0, chap - 1)) : begin(true));
  $("#next").addEventListener("click", () => started ? run(Math.min(CHAPTERS.length - 1, chap + 1)) : begin(true));
  $("#restart").addEventListener("click", () => started ? run(0) : begin(true));
  $("#replay").addEventListener("click", () => run(0));
  $("#mute").addEventListener("click", () => { initAudio(); setMuted(!muted); });
  $("#music").addEventListener("click", () => { initAudio(); musicOn = !musicOn; $("#music").classList.toggle("off", !musicOn); applyVolumes(); if (musicOn && started) startMusic(); });
  const full = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} };
  $("#full").addEventListener("click", full);
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("a") && e.key === "Enter") return;
    if (e.key === " ") { e.preventDefault(); $("#play").click(); }
    else if (e.key === "ArrowRight") $("#next").click();
    else if (e.key === "ArrowLeft") $("#prev").click();
    else if (e.key === "m" || e.key === "M") $("#mute").click();
    else if (e.key === "f" || e.key === "F") full();
    else if (e.key === "r" || e.key === "R") $("#restart").click();
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && playing) setPlaying(false); });

  /* Avant le départ : le site est déjà chargé derrière l'écran d'accueil */
  layout(); Object.assign(view, { x: L.W / 2, y: L.H / 2, z: 1 }); applyCam();
  cur.x = L.W * .7; cur.y = L.H * .75; placeCursor();
  loadSite("accueil").then(() => $("#curtain").classList.add("off"));
  })();
  </script>
</body>
</html>
